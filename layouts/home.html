{{ define "main" }}
<section class="intro">
  {{ .Content }}
</section>

<ul class="post-list">
  {{ range first 5 (where site.RegularPages "Section" "posts") }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
