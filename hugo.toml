# Site configuration. baseURL is overridden by the GitHub Actions workflow
# at deploy time, so the placeholder here only affects local preview.
baseURL = 'https://example.org/'
locale = 'en-US'
title = 'Teo Steverlynck-Horne'
enableRobotsTXT = true

# No tags/categories or section list pages; the homepage is the archive.
disableKinds = ['taxonomy', 'term', 'section']

[params]
description = 'A blog.'

[pagination]
pagerSize = 10
